<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Jogo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <div class="container">
        <h1>Novo Jogo</h1>

        <form method="POST" th:action="@{/paginas/jogos/novo}" th:object="${jogo}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Fifa 2026">

            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" th:field="*{desenvolvedora}" placeholder="Ex: EA Game">

            <label for="anoLancamento">Ano de Lançamento</label>
            <input type="number" id="anoLancamento" th:field="*{anoLancamento}" placeholder="Ex: 2013">

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" th:field="*{plataforma}" placeholder="Ex: PlayStation 4">

            <a th:href="@{/paginas/jogos}">Cancelar</a>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
