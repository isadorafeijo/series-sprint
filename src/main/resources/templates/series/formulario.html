<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Série</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <div class="container">
        <h1>Nova Série</h1>

        <form method="POST" th:action="@{/paginas/series/nova}" th:object="${serie}">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Breaking Bad">
			<span th:errors="*{nome}"></span>

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" th:field="*{plataforma}" placeholder="Ex: Netflix">
			<span th:errors="*{plataforma}"></span>

            <label for="anoLancamento">Ano de Lançamento</label>
            <input type="number" id="anoLancamento" th:field="*{anoLancamento}" placeholder="Ex: 2008">
			<span th:errors="*{anoLancamento}"></span>

            <label for="genero">Gênero</label>
            <input type="text" id="genero" th:field="*{genero}" placeholder="Ex: Drama">
			<span th:errors="*{genero}"></span>

            <a th:href="@{/paginas/series}">Cancelar</a>
            <button type="submit">Cadastrar</button>
        </form>
    </div>

</body>
</html>
