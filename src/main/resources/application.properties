spring.application.name=series

# Endereco do banco de dados MySQL.
# "localhost:3306" e o MySQL rodando no teu computador, na porta padrao.
# "series" e o nome do banco: troque se quiser usar outro nome.
# createDatabaseIfNotExist=true faz o MySQL criar o banco se ele ainda nao existir.
spring.datasource.url=jdbc:mysql://localhost:3306/series?createDatabaseIfNotExist=true

# Usuario e senha do MySQL do teu computador.
# Troque root se o teu usuario for outro, e troque SUA_SENHA pela tua senha.
spring.datasource.username=root
spring.datasource.password=SUA_SENHA

# update: o Hibernate cria e ajusta as tabelas a partir das entidades.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate executa, ja formatado.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false